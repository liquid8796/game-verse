<text x="249" y="216" font-family="Arial, sans-serif" font-size="38" fill="#f5cc74" text-anchor="middle">Seal the leak</text><text x="249" y="262" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="middle">Planks</text><text x="796" y="216" font-family="Arial, sans-serif" font-size="38" fill="#68d9d5" text-anchor="middle">Remove the water</text><text x="796" y="262" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="middle">Bailing</text>
<text x="550" y="650" font-family="Arial, sans-serif" font-size="36" fill="#e8edf0" text-anchor="middle">Check below deck and call the condition.</text><text x="550" y="704" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="middle">Meanwhile, the helm avoids more damage.</text>

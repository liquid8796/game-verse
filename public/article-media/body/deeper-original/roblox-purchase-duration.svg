<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">What are you buying — and for how long?</title><desc id="desc">Three invented offers in a Roblox racing experience distinguish a one-time garage-access pass, a repeatable single-attempt boost, and a renewing monthly club subscription. Their prices and availability are not real offers.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">What are you buying — and for how long?</text><text x="60" y="181" fill="#b2c0c9" font-size="27" font-weight="400">Invented offers in one racing experience. Read the actual confirmation.</text><rect x="60" y="220" width="1080" height="114" rx="0" fill="#172530"/><rect x="60" y="220" width="8" height="114" rx="0" fill="#9ee0b2"/><text x="91" y="266" fill="#f2f4ed" font-size="31" font-weight="700">Garage access</text><text x="91" y="307" fill="#9ee0b2" font-size="25" font-weight="400">Pass / one-time fee</text><text x="615" y="266" fill="#f2f4ed" font-size="29" font-weight="400">Do I want this privilege again?</text><text x="615" y="307" fill="#b2c0c9" font-size="25" font-weight="400">Confirm what access is included.</text><rect x="60" y="355" width="1080" height="114" rx="0" fill="#172530"/><rect x="60" y="355" width="8" height="114" rx="0" fill="#f2bf74"/><text x="91" y="401" fill="#f2f4ed" font-size="31" font-weight="700">One-attempt boost</text><text x="91" y="442" fill="#f2bf74" font-size="25" font-weight="400">Repeatable product</text><text x="615" y="401" fill="#f2f4ed" font-size="29" font-weight="400">Is this one attempt worth it?</text><text x="615" y="442" fill="#b2c0c9" font-size="25" font-weight="400">Check when the benefit is consumed.</text><rect x="60" y="490" width="1080" height="114" rx="0" fill="#172530"/><rect x="60" y="490" width="8" height="114" rx="0" fill="#8fcce2"/><text x="91" y="536" fill="#f2f4ed" font-size="31" font-weight="700">Monthly club</text><text x="91" y="577" fill="#8fcce2" font-size="25" font-weight="400">Subscription / renews</text><text x="615" y="536" fill="#f2f4ed" font-size="27" font-weight="400">Do I want a continuing payment?</text><text x="615" y="577" fill="#b2c0c9" font-size="25" font-weight="400">Read renewal and cancellation details.</text><text x="60" y="663" fill="#b2c0c9" font-size="27" font-weight="400">Same game. Three different commitments. None is a real advertised item.</text></g></svg>

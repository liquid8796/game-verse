<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc"><title id="title">Separate a pause inside a combo from a recovery window</title><desc id="desc">Two timeline rows show a fictional sequence of first swing, pause, second swing and recovery. Attacking during the pause is the early commitment; observing the second swing enables testing a short response during recovery.</desc><rect width="1000" height="1020" fill="#111820"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="64" font-size="27" fill="#CA9854" font-weight="700">BLACK MYTH: WUKONG / READ THE SEQUENCE</text><text x="60" y="130" font-size="44" fill="#F4F0E3" font-weight="700">The pause may contain another hit</text><path d="M60 162H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="229" font-size="28" fill="#B7BBC4" font-weight="400">Fictional sequence; no measured frame timings</text><text x="60" y="310" font-size="29" fill="#F4F0E3" font-weight="700">First swing</text><text x="310" y="310" font-size="29" fill="#F4F0E3" font-weight="700">Pause</text><text x="470" y="310" font-size="29" fill="#F4F0E3" font-weight="700">Second swing</text><text x="735" y="310" font-size="29" fill="#F4F0E3" font-weight="700">Recovery</text><rect x="60" y="335" width="210" height="42" fill="#CA9854"/><rect x="282" y="335" width="165" height="42" fill="#394552"/><rect x="459" y="335" width="245" height="42" fill="#CA9854"/><rect x="716" y="335" width="224" height="42" fill="#77B5A3"/><text x="60" y="451" font-size="35" fill="#E4A27D" font-weight="700">Early commitment</text><path d="M335 479H587" fill="none" stroke="#E4A27D" stroke-width="7" /><path d="M573 462L592 479L573 496" fill="none" stroke="#E4A27D" stroke-width="4" /><text x="60" y="542" font-size="31" fill="#B7BBC4" font-weight="400">Starting an attack during the pause</text><text x="60" y="584" font-size="31" fill="#B7BBC4" font-weight="400">can leave you caught by the follow-up.</text><text x="60" y="675" font-size="35" fill="#77B5A3" font-weight="700">Next test</text><path d="M80 706H685" fill="none" stroke="#ABADB6" stroke-width="5" /><path d="M740 706H903" fill="none" stroke="#77B5A3" stroke-width="7" /><text x="60" y="764" font-size="30" fill="#EAE8E0" font-weight="400">Watch the whole sequence</text><text x="690" y="808" font-size="30" fill="#77B5A3" font-weight="400">Try a short answer</text><text x="60" y="862" font-size="27" fill="#9AA3AF" font-weight="400">Spacing is illustrative, not a timing chart.</text><path d="M60 916H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="965" font-size="24" fill="#9AA3AF" font-weight="400">GAMEVERSE  /  EXPLANATORY DIAGRAM</text></g></svg>
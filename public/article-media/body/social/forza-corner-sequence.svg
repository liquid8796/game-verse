<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description"><title id="title">One corner, three clear jobs</title><desc id="description">A schematic right-hand bend separates straight braking, turning and progressive power at the exit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#68d9d5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5cc74"/></marker></defs><rect width="1100" height="760" fill="#121b24"/><text x="55" y="76" font-family="Arial, sans-serif" font-size="42" fill="#e8edf0" text-anchor="start">One corner, three clear jobs</text>
<path d="M195 574V398Q195 240 380 240H890" fill="none" stroke="#435360" stroke-width="174" stroke-linecap="butt"/><path d="M195 574V398Q195 240 380 240H890" fill="none" stroke="#74818a" stroke-width="3" stroke-dasharray="17 16"/>
<path d="M164 566V390" stroke="#f18b81" stroke-width="12" fill="none"/><path d="M164 390Q190 234 374 283" stroke="#68d9d5" stroke-width="12" fill="none"/><path d="M374 283Q550 298 867 269" stroke="#f5cc74" stroke-width="12" fill="none" marker-end="url(#gold)"/>
<rect x="141" y="437" width="46" height="83" rx="9" fill="#e8edf0"/><path d="M150 452H178V475H150ZM151 493H177" stroke="#24313d" stroke-width="4"/>
<text x="333" y="473" font-family="Arial, sans-serif" font-size="40" fill="#f18b81" text-anchor="start">1. Brake</text><text x="333" y="518" font-family="Arial, sans-serif" font-size="34" fill="#a8b8c3" text-anchor="start">while straight</text>
<text x="296" y="161" font-family="Arial, sans-serif" font-size="40" fill="#68d9d5" text-anchor="start">2. Turn</text><text x="672" y="158" font-family="Arial, sans-serif" font-size="40" fill="#f5cc74" text-anchor="start">3. Add power</text><text x="672" y="205" font-family="Arial, sans-serif" font-size="30" fill="#a8b8c3" text-anchor="start">as steering opens</text>
<path d="M55 630H1045" stroke="#465b69"/><text x="550" y="697" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="middle">Illustrative line; no fixed speed or braking point.</text>
</svg>

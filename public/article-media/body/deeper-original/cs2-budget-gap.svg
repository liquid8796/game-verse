<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">The same target does not give everyone $800.</title><desc id="desc">Two hypothetical next-round budgets share a 4,800-dollar target and 2,400 dollars of expected income. One player has 3,200 and may spend 800; the other has 2,100 and is already 300 short even with no spending. The diagram makes no current income or weapon-price claim.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">The same target does not give everyone $800.</text><text x="60" y="179" fill="#b2c0c9" font-size="27" font-weight="400">Hypothetical: $4,800 next-round target; $2,400 expected income.</text><text x="60" y="239" fill="#9ee0b2" font-size="26" font-weight="700">PLAYER A / $3,200 now</text><rect x="60" y="265" width="540" height="70" rx="0" fill="#9ee0b2"/><rect x="600" y="265" width="540" height="70" rx="0" fill="#8fcce2"/><text x="79" y="310" fill="#101820" font-size="29" font-weight="700">Keep $2,400</text><text x="753" y="310" fill="#101820" font-size="29" font-weight="700">Add $2,400</text><text x="60" y="376" fill="#f2f4ed" font-size="30" font-weight="400">Can spend $800 and still reach the example target.</text><text x="60" y="452" fill="#f2bf74" font-size="26" font-weight="700">PLAYER B / $2,100 now</text><rect x="60" y="477" width="472.5" height="70" rx="0" fill="#f2bf74"/><rect x="532.5" y="477" width="540" height="70" rx="0" fill="#8fcce2"/><rect x="1072.5" y="477" width="67.5" height="70" rx="0" fill="#643f3b"/><text x="80" y="522" fill="#101820" font-size="28" font-weight="700">Keep all $2,100</text><text x="692" y="522" fill="#101820" font-size="28" font-weight="700">Add $2,400</text><text x="60" y="589" fill="#f2f4ed" font-size="29" font-weight="400">Still $300 short. Plan a drop, a cheaper package, or a new target.</text><text x="60" y="663" fill="#b2c0c9" font-size="27" font-weight="400">Use the balances, income and prices shown in your actual match.</text></g></svg>

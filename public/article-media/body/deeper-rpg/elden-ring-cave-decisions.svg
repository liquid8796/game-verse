<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc"><title id="title">A cave expedition with a clear return route</title><desc id="desc">An invented route connects a Site of Grace, a cave entrance and a junction. An investigated branch returns to the junction; an unknown encounter remains optional.</desc><rect width="1000" height="1040" fill="#111820"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="64" font-size="27" fill="#CDB675" font-weight="700">ELDEN RING / SHORT EXPEDITION</text><text x="60" y="130" font-size="44" fill="#F4F0E3" font-weight="700">Know which journey you are making</text><path d="M60 162H940" fill="none" stroke="#394552" stroke-width="2" /><path d="M170 300H505V470M505 470H255V615M505 470H790V615" fill="none" stroke="#CDB675" stroke-width="5" /><circle cx="170" cy="300" r="20" fill="#CDB675"/><circle cx="505" cy="300" r="20" fill="#CDB675"/><circle cx="505" cy="470" r="20" fill="#CDB675"/><circle cx="255" cy="615" r="20" fill="#CDB675"/><circle cx="790" cy="615" r="20" fill="#DD986B"/><text x="82" y="254" font-size="34" fill="#F4F0E3" font-weight="700">Known Grace</text><text x="434" y="254" font-size="34" fill="#F4F0E3" font-weight="700">Entrance</text><text x="428" y="530" font-size="34" fill="#F4F0E3" font-weight="700">Junction</text><text x="60" y="671" font-size="29" fill="#B7BBC4" font-weight="400">Investigated branch</text><text x="60" y="713" font-size="29" fill="#B7BBC4" font-weight="400">Return here before</text><text x="60" y="755" font-size="29" fill="#B7BBC4" font-weight="400">trying another turn</text><text x="624" y="671" font-size="29" fill="#B7BBC4" font-weight="400">Unknown encounter</text><text x="624" y="713" font-size="29" fill="#B7BBC4" font-weight="400">Check healing and</text><text x="624" y="755" font-size="29" fill="#B7BBC4" font-weight="400">the repeat approach</text><path d="M220 615V495H455V342H220" fill="none" stroke="#77B5A3" stroke-width="4" stroke-dasharray="10 9"/><text x="62" y="815" font-size="30" fill="#F4F0E3" font-weight="400">Recovery trip? Retrieve the runes, then reassess.</text><text x="60" y="865" font-size="27" fill="#9AA3AF" font-weight="400">Invented route. This is not a dungeon map.</text><path d="M60 936H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="985" font-size="24" fill="#9AA3AF" font-weight="400">GAMEVERSE  /  EXPLANATORY DIAGRAM</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc"><title id="title">A hypothetical turn with an uncertain finishing shot</title><desc id="desc">A branching diagram compares the next archer turn with the ranged attack result. If the archer survives, the party reassesses. Area damage requires checking an ally in the preview.</desc><rect width="1000" height="1020" fill="#111820"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="64" font-size="27" fill="#AB94DE" font-weight="700">BALDUR’S GATE 3 / TURN DECISION</text><text x="60" y="130" font-size="44" fill="#F4F0E3" font-weight="700">A possible finish needs a fallback</text><path d="M60 162H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="230" font-size="35" fill="#AB94DE" font-weight="700">Hypothetical archer: 7 HP, acts next</text><text x="60" y="275" font-size="32" fill="#EAE8E0" font-weight="400">Example attack: 5–10 damage on a hit</text><path d="M100 312V376H875V312" fill="none" stroke="#5C6878" stroke-width="3" /><text x="60" y="363" font-size="32" fill="#EAE8E0" font-weight="400">Check movement → take the shot → read the result</text><path d="M490 398V442M490 442H260V515M490 442H750V515" fill="none" stroke="#AB94DE" stroke-width="5" /><circle cx="260" cy="528" r="16" fill="#80B8A2"/><circle cx="750" cy="528" r="16" fill="#E4A27D"/><text x="83" y="588" font-size="35" fill="#80B8A2" font-weight="700">Archer defeated</text><text x="595" y="588" font-size="35" fill="#E4A27D" font-weight="700">Archer survives</text><text x="82" y="640" font-size="30" fill="#B7BBC4" font-weight="400">Party can address</text><text x="82" y="682" font-size="30" fill="#B7BBC4" font-weight="400">the next threat.</text><text x="592" y="640" font-size="30" fill="#B7BBC4" font-weight="400">Reconsider remaining</text><text x="592" y="682" font-size="30" fill="#B7BBC4" font-weight="400">actions before it acts.</text><path d="M60 754H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="809" font-size="31" fill="#EAE8E0" font-weight="400">Before an area spell: check allies in the preview.</text><text x="60" y="857" font-size="27" fill="#9AA3AF" font-weight="400">Positions and numbers are illustrative.</text><path d="M60 916H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="965" font-size="24" fill="#9AA3AF" font-weight="400">GAMEVERSE  /  EXPLANATORY DIAGRAM</text></g></svg>
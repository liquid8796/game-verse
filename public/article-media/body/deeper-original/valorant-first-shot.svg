<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Three misses. Three different practice tasks.</title><desc id="desc">Conceptual cues distinguish losing the center against a bright background, aiming below the target, and shooting while moving. Their corresponding tests are contrast, placement and stopping. This is a diagram, not VALORANT gameplay or a UI.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">Three misses. Three different practice tasks.</text><text x="60" y="185" fill="#b2c0c9" font-size="27" font-weight="400">Find the earliest problem you can repeat; keep the other settings steady.</text><rect x="60" y="222" width="320" height="214" rx="0" fill="#dce4d3"/><line x1="204" y1="329" x2="215" y2="329" stroke="#c3ecd8" stroke-width="5" /><line x1="225" y1="329" x2="236" y2="329" stroke="#c3ecd8" stroke-width="5" /><line x1="220" y1="313" x2="220" y2="324" stroke="#c3ecd8" stroke-width="5" /><line x1="220" y1="334" x2="220" y2="345" stroke="#c3ecd8" stroke-width="5" /><rect x="440" y="222" width="320" height="214" rx="0" fill="#172530"/><circle cx="600" cy="283" r="24" fill="#8e9e9e"/><rect x="577" y="309" width="46" height="77" rx="0" fill="#718389"/><line x1="584" y1="371" x2="595" y2="371" stroke="#9ee0b2" stroke-width="5" /><line x1="605" y1="371" x2="616" y2="371" stroke="#9ee0b2" stroke-width="5" /><line x1="600" y1="355" x2="600" y2="366" stroke="#9ee0b2" stroke-width="5" /><line x1="600" y1="376" x2="600" y2="387" stroke="#9ee0b2" stroke-width="5" /><rect x="820" y="222" width="320" height="214" rx="0" fill="#172530"/><circle cx="980" cy="329" r="24" fill="#8e9e9e"/><line x1="964" y1="329" x2="975" y2="329" stroke="#9ee0b2" stroke-width="5" /><line x1="985" y1="329" x2="996" y2="329" stroke="#9ee0b2" stroke-width="5" /><line x1="980" y1="313" x2="980" y2="324" stroke="#9ee0b2" stroke-width="5" /><line x1="980" y1="334" x2="980" y2="345" stroke="#9ee0b2" stroke-width="5" /><line x1="880" y1="400" x2="1050" y2="400" stroke="#8fcce2" stroke-width="4" /><path d="M1033 388 l19 12 -19 12" fill="none" stroke="#8fcce2" stroke-width="4"/><text x="60" y="480" fill="#f2f4ed" font-size="28" font-weight="700">Center hard to find</text><text x="440" y="480" fill="#f2f4ed" font-size="28" font-weight="700">Aim begins too low</text><text x="820" y="480" fill="#f2f4ed" font-size="28" font-weight="700">Player still moving</text><text x="60" y="528" fill="#b2c0c9" font-size="26" font-weight="400">Repeat the same turn.</text><text x="440" y="528" fill="#b2c0c9" font-size="26" font-weight="400">Rehearse the approach.</text><text x="820" y="528" fill="#b2c0c9" font-size="26" font-weight="400">Repeat a stopping drill.</text><text x="60" y="573" fill="#9ee0b2" font-size="25" font-weight="400">Test one outline change.</text><text x="440" y="573" fill="#9ee0b2" font-size="24" font-weight="400">Keep aim near target height.</text><text x="820" y="573" fill="#9ee0b2" font-size="26" font-weight="400">Use practice feedback.</text><line x1="60" y1="619" x2="1140" y2="619" stroke="#34434d" stroke-width="3" /><text x="60" y="670" fill="#b2c0c9" font-size="27" font-weight="400">Conceptual cues only. A real miss may involve several causes.</text></g></svg>

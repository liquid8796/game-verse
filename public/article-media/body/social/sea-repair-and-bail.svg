<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description"><title id="title">A plank and a bucket do different jobs</title><desc id="description">A simplified ship cutaway shows a plank closing a hull hole while a bucket empties existing water over the rail.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#68d9d5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5cc74"/></marker></defs><rect width="1100" height="760" fill="#121b24"/><text x="55" y="76" font-family="Arial, sans-serif" font-size="42" fill="#e8edf0" text-anchor="start">A plank and a bucket do different jobs</text>
<path d="M150 307H950L850 570H285Z" fill="#263b46" stroke="#a8b8c3" stroke-width="8"/><path d="M229 468H889L850 567H285Z" fill="#236b86" opacity=".8"/>

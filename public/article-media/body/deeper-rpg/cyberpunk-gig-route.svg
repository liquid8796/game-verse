<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-labelledby="title desc"><title id="title">An illustrative gig approach and fallback route</title><desc id="desc">A schematic shows a side entrance leading to an objective and a clear return path. A separate branch heads to known cover if detection happens, before reassessing the objective.</desc><rect width="1000" height="1010" fill="#111820"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="64" font-size="27" fill="#F2DC3C" font-weight="700">CYBERPUNK 2077 / A GIG EXPERIMENT</text><text x="60" y="130" font-size="44" fill="#F4F0E3" font-weight="700">Give detection a planned response</text><path d="M60 162H940" fill="none" stroke="#394552" stroke-width="2" /><rect x="352" y="218" width="546" height="505" fill="#1B2734" stroke="#5C6878" stroke-width="3"/><path d="M352 385V478" stroke="#111820" stroke-width="12"/><text x="402" y="270" font-size="32" fill="#F2DC3C" font-weight="700">Guarded building</text><path d="M103 450H345L640 375" fill="none" stroke="#F2DC3C" stroke-width="6" /><circle cx="103" cy="450" r="16" fill="#F2DC3C"/><circle cx="640" cy="375" r="18" fill="#F2DC3C"/><text x="63" y="394" font-size="31" fill="#EAE8E0" font-weight="400">Street</text><text x="82" y="518" font-size="30" fill="#EAE8E0" font-weight="400">Side entrance</text><text x="574" y="333" font-size="32" fill="#F4F0E3" font-weight="700">Objective</text><path d="M630 395L420 625H45V480" fill="none" stroke="#85B8A4" stroke-width="5" stroke-dasharray="11 9"/><text x="70" y="681" font-size="30" fill="#85B8A4" font-weight="400">Known exit / return</text><path d="M430 459L661 619" fill="none" stroke="#E4A27D" stroke-width="5" stroke-dasharray="11 9"/><circle cx="680" cy="635" r="16" fill="#E4A27D"/><text x="589" y="687" font-size="30" fill="#E4A27D" font-weight="400">Known cover</text><text x="60" y="800" font-size="31" fill="#EAE8E0" font-weight="400">If detected: stabilize, then choose the next step.</text><text x="60" y="850" font-size="27" fill="#9AA3AF" font-weight="400">Illustrative layout. Routes are not to scale.</text><path d="M60 906H940" fill="none" stroke="#394552" stroke-width="2" /><text x="60" y="955" font-size="24" fill="#9AA3AF" font-weight="400">GAMEVERSE  /  EXPLANATORY DIAGRAM</text></g></svg>
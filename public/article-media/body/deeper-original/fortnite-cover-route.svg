<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Choose the place you can stop after crossing.</title><desc id="desc">A terrain sketch compares a direct crossing from a post-fight loot pile into an exposed area with an illustrative route through intermediate cover to a covered destination. It is not a map of Fortnite island or a guaranteed safe route.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">Choose the place you can stop after crossing.</text><text x="60" y="179" fill="#b2c0c9" font-size="27" font-weight="400">Illustrative Zero Build situation after a fight — not a current island map.</text><rect x="60" y="216" width="1080" height="376" rx="0" fill="#22392f"/><rect x="548" y="216" width="94" height="376" rx="0" fill="#596363"/><line x1="595" y1="216" x2="595" y2="592" stroke="#bbc3b2" stroke-width="3" stroke-dasharray="18 18"/><rect x="102" y="365" width="196" height="105" rx="0" fill="#354c3e"/><text x="119" y="406" fill="#f2f4ed" font-size="26" font-weight="700">Fight ended</text><text x="119" y="443" fill="#b2c0c9" font-size="23" font-weight="400">Drops nearby</text><rect x="407" y="242" width="112" height="77" rx="0" fill="#72988b"/><rect x="813" y="416" width="187" height="103" rx="0" fill="#72988b"/><text x="360" y="231" fill="#9ee0b2" font-size="23" font-weight="700">Intermediate cover</text><text x="815" y="556" fill="#9ee0b2" font-size="25" font-weight="700">Covered destination</text><path d="M292 381 Q332 307 403 283 M522 292 Q697 346 815 455" fill="none" stroke="#9ee0b2" stroke-width="8" stroke-dasharray="14 8"/><path d="M800 437 l19 18 -24 5" fill="none" stroke="#9ee0b2" stroke-width="5"/><line x1="298" y1="414" x2="870" y2="300" stroke="#f19b8e" stroke-width="5" stroke-dasharray="12 10"/><circle cx="882" cy="297" r="15" fill="#f19b8e"/><text x="824" y="270" fill="#f19b8e" font-size="25" font-weight="700">Exposed stop</text><text x="60" y="653" fill="#b2c0c9" font-size="27" font-weight="400">Recovery and a next destination should earn time before another loot swap.</text></g></svg>

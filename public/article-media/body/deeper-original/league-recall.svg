<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">The item is ready. Is the lane ready?</title><desc id="desc">Two hypothetical recall situations compare leaving while an enemy wave approaches your turret with leaving after your wave reaches the enemy turret. Health, safety and nearby players can change either decision.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">The item is ready. Is the lane ready?</text><rect x="60" y="181" width="1080" height="191" rx="0" fill="#172530"/><text x="90" y="225" fill="#f2bf74" font-size="31" font-weight="700">A / Enemy minions approaching your turret</text><rect x="96" y="253" width="38" height="68" rx="0" fill="#63899a"/><line x1="171" y1="282" x2="882" y2="282" stroke="#40515a" stroke-width="6" /><circle cx="613" cy="282" r="14" fill="#f19b8e"/><circle cx="661" cy="282" r="14" fill="#f19b8e"/><circle cx="709" cy="282" r="14" fill="#f19b8e"/><path d="M545 270 l-25 12 25 12" fill="none" stroke="#f19b8e" stroke-width="4"/><text x="163" y="331" fill="#f2f4ed" font-size="28" font-weight="400">Stay for resources if safe; leave if staying risks being killed.</text><rect x="60" y="400" width="1080" height="191" rx="0" fill="#172530"/><text x="90" y="444" fill="#9ee0b2" font-size="31" font-weight="700">B / Your wave has reached the enemy turret</text><rect x="969" y="469" width="38" height="68" rx="0" fill="#a77d73"/><line x1="174" y1="498" x2="925" y2="498" stroke="#40515a" stroke-width="6" /><circle cx="757" cy="498" r="14" fill="#8fcce2"/><circle cx="805" cy="498" r="14" fill="#8fcce2"/><circle cx="853" cy="498" r="14" fill="#8fcce2"/><path d="M899 486 l25 12 -25 12" fill="none" stroke="#8fcce2" stroke-width="4"/><text x="163" y="547" fill="#f2f4ed" font-size="27" font-weight="400">A useful purchase plus a safe exit may make this a better window.</text><text x="60" y="657" fill="#b2c0c9" font-size="27" font-weight="400">Illustrated situations, not a guaranteed recall rule for every matchup.</text></g></svg>

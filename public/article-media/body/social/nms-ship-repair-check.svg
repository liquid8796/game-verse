<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description"><title id="title">Check the two components separately</title><desc id="description">Pulse Engine repairs require installing the named product; the Launch Thruster has separate damage and fuel checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#68d9d5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5cc74"/></marker></defs><rect width="1100" height="760" fill="#121b24"/><text x="55" y="76" font-family="Arial, sans-serif" font-size="42" fill="#e8edf0" text-anchor="start">Check the two components separately</text>
<path d="M550 153V625" stroke="#465b69" stroke-width="2"/>
<text x="288" y="215" font-family="Arial, sans-serif" font-size="40" fill="#68d9d5" text-anchor="middle">Pulse Engine</text><text x="814" y="215" font-family="Arial, sans-serif" font-size="40" fill="#f5cc74" text-anchor="middle">Launch Thruster</text>
<text x="288" y="318" font-family="Arial, sans-serif" font-size="34" fill="#e8edf0" text-anchor="middle">Read the repair slot</text><path d="M288 340V377" stroke="#68d9d5" stroke-width="4" marker-end="url(#arrow)"/><text x="288" y="426" font-family="Arial, sans-serif" font-size="34" fill="#e8edf0" text-anchor="middle">Pin and craft</text><path d="M288 450V484" stroke="#68d9d5" stroke-width="4" marker-end="url(#arrow)"/><text x="288" y="535" font-family="Arial, sans-serif" font-size="34" fill="#e8edf0" text-anchor="middle">Install the product</text>
<path d="M722 287H906L891 347H737Z" fill="#30414b" stroke="#f5cc74" stroke-width="4"/><path d="M762 363L748 390M814 363V400M865 363L879 390" stroke="#f5cc74" stroke-width="5"/>
<text x="814" y="447" font-family="Arial, sans-serif" font-size="32" fill="#e8edf0" text-anchor="middle">Read its own warning</text><text x="814" y="505" font-family="Arial, sans-serif" font-size="34" fill="#f5cc74" text-anchor="middle">Damage? Repair.</text><text x="814" y="558" font-family="Arial, sans-serif" font-size="34" fill="#f5cc74" text-anchor="middle">Low fuel? Recharge.</text>
<path d="M55 631H1045" stroke="#465b69"/><text x="550" y="699" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="middle">Ingredients carried are not a repair installed.</text>
</svg>

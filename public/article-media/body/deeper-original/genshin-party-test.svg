<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">The second fight tells you what to check.</title><desc id="desc">A hypothetical party test connects three recurring problems to different checks: an unavailable burst to energy requirements, competing on-field abilities to their descriptions and time needs, and an interrupted sequence to survival. It does not prescribe a rotation or numerical build.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">The second fight tells you what to check.</text><text x="60" y="182" fill="#b2c0c9" font-size="28" font-weight="400">Repeat a short sequence in comparable ordinary encounters.</text><text x="60" y="248" fill="#b2c0c9" font-size="22" font-weight="700">OBSERVATION</text><text x="658" y="248" fill="#b2c0c9" font-size="22" font-weight="700">NEXT CHECK</text><line x1="60" y1="268" x2="1140" y2="268" stroke="#40515a" stroke-width="3" /><text x="60" y="323" fill="#f2bf74" font-size="31" font-weight="700">Burst is unavailable again</text><text x="660" y="323" fill="#f2f4ed" font-size="28" font-weight="400">Energy requirements and equipment</text><line x1="546" y1="314" x2="616" y2="314" stroke="#f2bf74" stroke-width="4" /><path d="M602 303 l16 11 -16 11" fill="none" stroke="#f2bf74" stroke-width="4"/><text x="60" y="374" fill="#b2c0c9" font-size="25" font-weight="400">A simpler sequence may repeat more reliably.</text><line x1="60" y1="405" x2="1140" y2="405" stroke="#34434d" stroke-width="3" /><text x="60" y="457" fill="#8fcce2" font-size="29" font-weight="700">Two abilities need field time</text><text x="660" y="457" fill="#f2f4ed" font-size="29" font-weight="400">What persists after switching?</text><line x1="546" y1="448" x2="616" y2="448" stroke="#8fcce2" stroke-width="4" /><path d="M602 437 l16 11 -16 11" fill="none" stroke="#8fcce2" stroke-width="4"/><text x="60" y="501" fill="#b2c0c9" font-size="25" font-weight="400">Read the actual talents before shortening a turn.</text><line x1="60" y1="531" x2="1140" y2="531" stroke="#34434d" stroke-width="3" /><text x="60" y="581" fill="#f19b8e" font-size="28" font-weight="700">Damage interrupts the sequence</text><text x="660" y="581" fill="#f2f4ed" font-size="29" font-weight="400">Survival and a defensive option</text><line x1="546" y1="572" x2="616" y2="572" stroke="#f19b8e" stroke-width="4" /><path d="M602 561 l16 11 -16 11" fill="none" stroke="#f19b8e" stroke-width="4"/><text x="60" y="635" fill="#9ee0b2" font-size="27" font-weight="400">Change one contribution, then repeat the same kind of encounter.</text></g></svg>

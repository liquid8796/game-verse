<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Six hours planned. Three and a half for solo play.</title><desc id="desc">A 360-minute gaming week assigns 90 minutes to friends, 30 to setup, 30 as spare time, leaving 210 minutes for a solo game. A hypothetical 30-hour adventure takes about nine weeks at that pace.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#101820"/><text x="60" y="65" fill="#b2c0c9" font-size="21" font-weight="700">GAMEVERSE / WORKED EXAMPLE</text><text x="60" y="124" fill="#f2f4ed" font-size="42" font-weight="700">Six hours planned. Three and a half for solo play.</text><text x="60" y="185" fill="#b2c0c9" font-size="27" font-weight="400">A hypothetical week with two 90-minute evenings and a 3-hour Sunday.</text><rect x="60" y="228" width="270" height="84" rx="0" fill="#8fcce2"/><rect x="330" y="228" width="90" height="84" rx="0" fill="#f2bf74"/><rect x="420" y="228" width="90" height="84" rx="0" fill="#485d69"/><rect x="510" y="228" width="630" height="84" rx="0" fill="#9ee0b2"/><text x="82" y="281" fill="#101820" font-size="30" font-weight="700">Friends</text><text x="728" y="281" fill="#101820" font-size="30" font-weight="700">Solo game</text><line x1="330" y1="333" x2="330" y2="364" stroke="#f2bf74" stroke-width="3" /><line x1="420" y1="333" x2="420" y2="426" stroke="#b2c0c9" stroke-width="3" /><text x="60" y="370" fill="#8fcce2" font-size="29" font-weight="700">90 min / friends</text><text x="60" y="430" fill="#f2bf74" font-size="29" font-weight="700">30 min / setup</text><text x="60" y="490" fill="#b2c0c9" font-size="29" font-weight="700">30 min / kept free</text><rect x="570" y="365" width="570" height="171" rx="0" fill="#172530"/><text x="600" y="411" fill="#9ee0b2" font-size="28" font-weight="700">360 − 90 − 30 − 30 = 210 minutes</text><text x="600" y="458" fill="#f2f4ed" font-size="27" font-weight="400">210 minutes = 3.5 hours of solo play</text><text x="600" y="505" fill="#f2f4ed" font-size="27" font-weight="400">30-hour example ÷ 3.5 ≈ 9 weeks</text><line x1="60" y1="578" x2="1140" y2="578" stroke="#34434d" stroke-width="3" /><text x="60" y="633" fill="#b2c0c9" font-size="28" font-weight="400">The game length is an example. The time already has other jobs.</text></g></svg>

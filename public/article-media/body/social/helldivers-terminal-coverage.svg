<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description"><title id="title">Give the operator room</title><desc id="description">A hypothetical overhead layout puts a terminal against a wall and three teammates between the operator and open approaches.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#68d9d5"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5cc74"/></marker></defs><rect width="1100" height="760" fill="#121b24"/><text x="55" y="76" font-family="Arial, sans-serif" font-size="42" fill="#e8edf0" text-anchor="start">Give the operator room</text>
<path d="M140 183H960" stroke="#465b69" stroke-width="34"/><path d="M140 208H960" stroke="#a8b8c3" stroke-width="3"/><text x="550" y="167" font-family="Arial, sans-serif" font-size="28" fill="#a8b8c3" text-anchor="middle">WALL</text>
<rect x="465" y="212" width="170" height="95" rx="6" fill="#243d47" stroke="#68d9d5" stroke-width="3"/><path d="M499 244H601M499 265H570" stroke="#68d9d5" stroke-width="6"/><circle cx="550" cy="352" r="22" fill="#f5cc74"/><circle cx="550" cy="352" r="31" fill="none" stroke="#f5cc74" stroke-width="2" opacity=".45"/><text x="550" y="420" font-family="Arial, sans-serif" font-size="36" fill="#f5cc74" text-anchor="middle">Operator</text>
<path d="M297 475L167 570L167 360Z" fill="#68d9d5" opacity=".14"/><path d="M803 475L933 570L933 360Z" fill="#68d9d5" opacity=".14"/><circle cx="297" cy="475" r="22" fill="#68d9d5"/><circle cx="297" cy="475" r="31" fill="none" stroke="#68d9d5" stroke-width="2" opacity=".45"/><circle cx="803" cy="475" r="22" fill="#68d9d5"/><circle cx="803" cy="475" r="31" fill="none" stroke="#68d9d5" stroke-width="2" opacity=".45"/><circle cx="550" cy="516" r="22" fill="#68d9d5"/><circle cx="550" cy="516" r="31" fill="none" stroke="#68d9d5" stroke-width="2" opacity=".45"/>
<path d="M270 475H185M830 475H915" stroke="#68d9d5" stroke-width="5" marker-end="url(#arrow)"/><text x="297" y="558" font-family="Arial, sans-serif" font-size="32" fill="#e8edf0" text-anchor="middle">Left approach</text><text x="803" y="558" font-family="Arial, sans-serif" font-size="32" fill="#e8edf0" text-anchor="middle">Right approach</text><text x="550" y="582" font-family="Arial, sans-serif" font-size="32" fill="#e8edf0" text-anchor="middle">Close cover</text>
<path d="M645 345Q740 365 740 450" stroke="#f5cc74" stroke-width="5" fill="none" stroke-dasharray="10 12" marker-end="url(#gold)"/><text x="725" y="312" font-family="Arial, sans-serif" font-size="28" fill="#f5cc74" text-anchor="start">Keep an exit</text>
<path d="M55 640H1045" stroke="#465b69"/><text x="55" y="703" font-family="Arial, sans-serif" font-size="32" fill="#a8b8c3" text-anchor="start">Example positions; adapt to the terrain.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Compare one crosshair against bright and dark backgrounds</title>
  <desc id="desc">The same small cyan cross with a thin dark outline appears on a pale wall and a dark doorway. Keep its color, size and gap fixed; adjust only the outline and repeat the test. The drawing is enlarged for comparison and does not prescribe settings.</desc>
  <defs>
    <g id="cross" fill="none" stroke-linecap="square">
      <path d="M-19 0h11M8 0h11M0-19v11M0 8v11" stroke="#152027" stroke-width="6"/>
      <path d="M-19 0h11M8 0h11M0-19v11M0 8v11" stroke="#60f0e2" stroke-width="3"/>
    </g>
    <pattern id="wall" width="92" height="78" patternUnits="userSpaceOnUse">
      <path d="M0 78h92M92 0v78" fill="none" stroke="#bdc8cb" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#10181d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="61" fill="#60f0e2" font-size="36" font-weight="700" letter-spacing="2">VALORANT / READABILITY</text>
    <text x="48" y="121" fill="#f3f5f4" font-size="56" font-weight="700">One profile. Two backgrounds.</text>
    <text x="48" y="170" fill="#a5b5bb" font-size="36">Enlarged illustration · No universal settings</text>
    <rect x="48" y="196" width="534" height="318" fill="#dce6e4"/>
    <rect x="48" y="196" width="534" height="318" fill="url(#wall)"/>
    <path d="M395 196v318M48 442h534" stroke="#b4c3c5" stroke-width="3"/>
    <rect x="618" y="196" width="534" height="318" fill="#23333b"/>
    <path d="M735 514V229h297v285" fill="#142027" stroke="#4d616a" stroke-width="4"/>
    <path d="M738 513 785 439h197l48 74" fill="#304149"/>
    <use href="#cross" x="315" y="348"/>
    <use href="#cross" x="885" y="348"/>
    <text x="74" y="482" fill="#273c42" font-size="44" font-weight="700">Bright wall</text>
    <text x="644" y="482" fill="#cbd7da" font-size="44" font-weight="700">Dark doorway</text>
    <path d="M48 551h1104" stroke="#3e5058" stroke-width="2"/>
    <text x="48" y="604" fill="#f3f5f4" font-size="44" font-weight="700">Keep color, size and gap fixed.</text>
    <text x="48" y="657" fill="#b8c5c8" font-size="44">Change the outline. Test again.</text>
    <text x="1152" y="692" text-anchor="end" fill="#7d939c" font-size="20">GAMEVERSE ILLUSTRATION</text>
  </g>
</svg>
